name: ReleaseGuard
on:
  pull_request:
  push:
    branches: [main, "hackathon/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run controller and behavior tests
        run: python -m unittest discover -s tests -v
      - name: Exercise Docker slots and NGINX on this runner
        run: bash deployment/ci_smoke.sh
      - name: Collect measured release decisions
        if: ${{ !cancelled() }}
        run: |
          if curl -fsS --max-time 5 http://127.0.0.1:8787/api/state -o "$RUNNER_TEMP/state.json"; then
            jq . "$RUNNER_TEMP/state.json" > "$RUNNER_TEMP/releaseguard-evidence.json"
            {
              echo '### Synthetic checkout results'
              echo
              echo '| Scenario | Decision | Behavior fixtures passed | Recovery fixtures passed |'
              echo '| --- | --- | --- | --- |'
              jq -r '.releases | reverse[] | "| \(.scenario) | \(.status) | \(.behavior.passed // "—") | \(.recovery.passed // "—") |"' "$RUNNER_TEMP/state.json"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save release evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: releaseguard-evidence
          path: ${{ runner.temp }}/releaseguard-evidence.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions: {contents: read, packages: write}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Sign in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish checkout
        id: build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/checkout"
          docker buildx build --target checkout --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:$GITHUB_SHA" --metadata-file "$RUNNER_TEMP/image.json" --push .
          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/image.json")
          echo "digest=$image@$digest" >> "$GITHUB_OUTPUT"
          printf 'Commit `%s`\n\nCheckout image `%s@%s`\n' "$GITHUB_SHA" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.RG_DEPLOY_ENABLED == 'true'
    environment: hackathon-vm
    concurrency: {group: releaseguard-hackathon-vm, cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Submit release over an authenticated SSH tunnel
        env:
          RG_SSH_KEY: ${{ secrets.RG_SSH_KEY }}
          RG_KNOWN_HOSTS: ${{ secrets.RG_KNOWN_HOSTS }}
          RG_VM_HOST: ${{ vars.RG_VM_HOST }}
          RG_VM_USER: ${{ vars.RG_VM_USER }}
          RG_DEPLOY_TOKEN: ${{ secrets.RG_DEPLOY_TOKEN }}
          RG_CANDIDATE_DIGEST: ${{ needs.publish.outputs.digest }}
          RG_COMMIT_SHA: ${{ github.sha }}
          RG_CONTROLLER_URL: http://127.0.0.1:18787
        run: |
          umask 077
          printf '%s\n' "$RG_SSH_KEY" > "$RUNNER_TEMP/vm.key"
          printf '%s\n' "$RG_KNOWN_HOSTS" > "$RUNNER_TEMP/vm.known_hosts"
          ssh -NT -o BatchMode=yes -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=10 -o "UserKnownHostsFile=$RUNNER_TEMP/vm.known_hosts" \
            -i "$RUNNER_TEMP/vm.key" -L 127.0.0.1:18787:127.0.0.1:8787 \
            "$RG_VM_USER@$RG_VM_HOST" &
          tunnel=$!
          trap 'kill "$tunnel" 2>/dev/null || true' EXIT
          python3 deployment/trigger.py
